<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vlog List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px; /* Space between the back button and heading */
        }

        .header a {
            font-size: 24px; /* Icon size */
            text-decoration: none; /* Remove underline */
            color: #333; /* Icon color */
        }

        h1 {
            font-size: 2em;
            margin: 0;
        }

        #vlogList {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .vlog-item {
            display: flex;
            flex-direction: column;
            background-color: #d3d3d3; /* Gray background */
            padding: 15px;
            border-radius: 8px;
            width: 80%; /* Width of the item */
            max-width: 600px;
            margin: auto;
        }

        .vlog-item .datetime {
            align-self: flex-end; /* Right-align datetime */
            font-weight: bold;
        }

        .vlog-item .text {
            margin-top: 10px;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="index.html"><i class="bi bi-arrow-left"></i></a>
        <h1>My Blogs</h1>
    </div> <br>

    <div id="vlogList">Loading...</div>

    <!-- Firebase libraries -->
    <script type="module" src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <script type="module">
        // Import required Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // Your Firebase config
        const firebaseConfig = {
            apiKey: 'AIzaSyDA-DQsNJdopJbScS1NvM9yFt8XOfbc_Hg',
            appId: '1:574606860873:web:b6cd6ccbfa4e5a37e8d598',
            messagingSenderId: '574606860873',
            projectId: 'my-vlog1',
            authDomain: 'my-vlog1.firebaseapp.com',
            storageBucket: 'my-vlog1.firebasestorage.app',
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch and display vlogs
        async function fetchVlogs() {
            const vlogRef = collection(db, "vlog");
            const vlogQuery = query(vlogRef, orderBy("datetime", "desc")); // Fetch descending order
            const snapshot = await getDocs(vlogQuery);

            const container = document.getElementById('vlogList');
            container.innerHTML = ''; // Clear "Loading..." text

            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.datetime.toDate(); // Convert Firestore Timestamp to JavaScript Date

                // Format the date nicely
                const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: 'numeric' };
                const formattedDate = new Intl.DateTimeFormat('en-US', options).format(date);

                // Create vlog item div
                const vlogItem = document.createElement('div');
                vlogItem.classList.add('vlog-item'); // Add CSS class for styling

                // Create datetime and text elements
                const datetimeDiv = document.createElement('div');
                datetimeDiv.classList.add('datetime'); // Add CSS class for datetime styling
                datetimeDiv.textContent = formattedDate;

                const textDiv = document.createElement('div');
                textDiv.classList.add('text'); // Add CSS class for text styling
                textDiv.textContent = data.text;

                // Append datetime and text to the vlog item
                vlogItem.appendChild(datetimeDiv);
                vlogItem.appendChild(textDiv);

                // Append the vlog item to the container
                container.appendChild(vlogItem);
            });
        }

        fetchVlogs();
    </script>
</body>

</html>
